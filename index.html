<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Figtree",-apple-system,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--fg)}
body{font:15px/1.4 var(--body);padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) 40px max(16px,env(safe-area-inset-left,0))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px;padding-top:14px}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font:900 36px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.02em}h1 span{color:var(--amber)}
.tally{color:var(--mute);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}.tally b{color:var(--up)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--deck);color:var(--mute);border-radius:999px;padding:8px 13px;font:600 13px var(--body)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.now{background:var(--deck);border:1px solid var(--rule);border-radius:16px;padding:12px;display:grid;gap:12px}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meta .t{font-weight:700;font-size:17px;overflow-wrap:anywhere}.meta .g{color:var(--amber);font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;flex:none}
.sub{color:var(--mute);font-size:13px;margin-top:-8px;overflow-wrap:anywhere}
iframe{width:100%;height:166px;border:0;border-radius:10px;background:#000}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote button{min-height:72px;border-radius:14px;border:0;font:900 22px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.dn{background:var(--down)}.upb{background:var(--up)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 a,.row2 button{min-height:46px;border-radius:12px;border:1px solid var(--rule);background:transparent;color:var(--fg);font:600 14px var(--body);display:flex;align-items:center;justify-content:center;text-decoration:none}
h2{font:900 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 0}
.style{display:flex;flex-wrap:wrap;gap:6px}.style span{background:var(--deck);border:1px solid var(--rule);border-radius:999px;padding:5px 10px;font-size:13px}
.style span.neg{color:var(--mute);text-decoration:line-through}
.likes{display:grid}.like{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.like .t{font-weight:600;overflow-wrap:anywhere}.like .s{color:var(--mute);font-size:12px}
.like a{color:var(--ink);background:var(--amber);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;text-decoration:none}
.send{min-height:52px;border-radius:14px;border:0;background:var(--amber);color:var(--ink);font:900 18px var(--display);letter-spacing:.06em;text-transform:uppercase}
.note{color:var(--mute);font-size:12px}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style></head><body><div class="wrap">
<div class="top"><h1>Crate <span>Dig</span></h1><div class="tally" id="tally"></div></div>
<div class="chips" id="genres"></div>
<section class="now">

  <div class="sub" id="artist">Free downloads from this week's Hypeddit charts</div>
  <iframe id="sc" allow="autoplay" title="SoundCloud player"></iframe>
  <div class="vote"><button class="dn" id="down" aria-label="Thumbs down">Nah</button><button class="upb" id="up" aria-label="Thumbs up">Keep</button></div>
  <div class="row2"><button id="skip">Skip for now</button><a id="dl" target="_blank" rel="noopener">Free download</a></div>
</section>
<h2>Your sound so far</h2>
<div class="style" id="style"><span>Thumb a few tracks and your style shows up here.</span></div>
<h2>Keeps</h2>
<div class="likes" id="likes"></div>
<button class="send" id="send">Send my picks to Claude</button>
<div class="note" id="sendnote">Copies your keeps, nahs and style so you can paste them into Claude. Picks also stay saved on this phone.</div>
</div>

function meta(){widget.getCurrentSound(s=>{if(!s||!cur)return;cur.title=s.title;cur.artist=s.user&&s.user.username;cur.sg=s.genre||'';cur.tags=(s.tag_list||'').match(/"[^"]+"|\S+/g)||[];cur.url=s.permalink_url;show({title:cur.title,artist:cur.artist+(s.genre?' · '+s.genre:'')})})}

function profile(){const sc={};const add=(k,w)=>{k=(k||'').toLowerCase().trim();if(!k||k.length<3||/free|download|hypeddit|^\d+$/.test(k))return;sc[k]=(sc[k]||0)+w};
  Object.values(P).forEach(p=>{const w=p.v==='up'?1:-1;add(p.sg,w*2);add(p.g,w);(p.tags||[]).forEach(t=>add(t,w));add(p.artist,w*1.5)});

function render(){const v=Object.values(P);const ups=v.filter(p=>p.v==='up');

  $('likes').innerHTML=ups.length?ups.map(p=>`<div class="like"><div><div class="t">${esc(p.title||'Untitled')}</div><div class="s">${esc(p.artist||'')} · ${esc(p.g)}</div></div><a href="https://hypeddit.com/track/${p.dl}" target="_blank" rel="noopener">Download</a></div>`).join(''):'<div class="note">Nothing kept yet.</div>'}
